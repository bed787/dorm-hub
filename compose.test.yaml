name: dorm-hub-tests
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dormhub
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: dormhub_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dormhub -d dormhub_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
  tests:
    image: golang:1.27-alpine
    working_dir: /src
    volumes:
      - .:/src:ro
      - gomod:/go/pkg/mod
    environment:
      TEST_DATABASE_URL: postgres://dormhub:test_password@db:5432/dormhub_test?sslmode=disable
      CGO_ENABLED: "1"
      TEST_MEILI_URL: http://meilisearch:7700
      TEST_MEILI_MASTER_KEY: integration-test-only-meili-key-32bytes
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    command: ["sh", "-c", "apk add --no-cache gcc musl-dev && cp -R /src /work && cd /work && go mod tidy && go vet ./... && go test -race -count=1 ./..."]
  meilisearch:
    image: getmeili/meilisearch:v1.55.0
    mem_limit: 512m
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: integration-test-only-meili-key-32bytes
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 128MiB
      MEILI_MAX_INDEXING_THREADS: "1"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  gomod:
