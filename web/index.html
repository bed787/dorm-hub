<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f3ef"><meta name="description" content="{{.Description}}">
<title>{{.Title}}</title>
{{if .Landing}}<link rel="canonical" href="{{.Canonical}}"><meta property="og:type" content="website"><meta property="og:title" content="{{.Title}}"><meta property="og:description" content="{{.Description}}"><meta property="og:url" content="{{.Canonical}}">{{else}}<meta name="robots" content="noindex, nofollow">{{end}}
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg?v={{assetVersion}}">
<script src="/assets/theme.js?v={{assetVersion}}"></script>
<link rel="stylesheet" href="/assets/app.css?v={{assetVersion}}"><link rel="stylesheet" href="/assets/public.css?v={{assetVersion}}"><script src="/assets/utils.js?v={{assetVersion}}" defer></script><script src="/assets/requests.js?v={{assetVersion}}" defer></script><script src="/assets/selects.js?v={{assetVersion}}" defer></script><script src="/assets/editor-store.js?v={{assetVersion}}" defer></script><script src="/assets/app.js?v={{assetVersion}}" defer></script>
</head>
<body><template id="brand-mark">{{brand}}</template><div id="app">{{if .Landing}}{{template "landing" .}}{{else}}<div class="boot" role="status">Открываем Dorm Hub…</div>{{end}}</div>
{{if not .Landing}}<template id="public-landing">{{template "landing" .}}</template>{{end}}
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
<noscript>Для работы Dorm Hub включите JavaScript в браузере.</noscript>
</body></html>
