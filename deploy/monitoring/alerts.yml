groups:
  - name: dorm-hub
    rules:
      - alert: ApplicationUnavailable
        expr: up{job="dorm-hub"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Приложение недоступно для мониторинга"}
      - alert: DatabaseUnavailable
        expr: dormhub_database_up == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Приложение не может подключиться к PostgreSQL"}
      - alert: SMTPFailures
        expr: sum(increase(dormhub_smtp_messages_total{result="error"}[5m])) > 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Не удалось отправить письмо с кодом"}
      - alert: ServerErrors
        expr: (sum(increase(dormhub_http_requests_total{status=~"5..",route!~"GET /ready|/monitoring/"}[5m])) >= 3) and on() (dormhub_maintenance_enabled == 0)
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Повторяются серверные ошибки HTTP"}
      - alert: LowDiskSpace
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "На системном диске осталось меньше 15%"}
      - alert: HighMemoryUsage
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.90
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Занято больше 90% доступной памяти"}
