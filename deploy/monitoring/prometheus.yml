global:
  scrape_interval: 30s
  scrape_timeout: 5s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: dorm-hub
    static_configs:
      - targets: [dorm-hub-app:9091]
    sample_limit: 5000
  - job_name: host
    static_configs:
      - targets: [node-exporter:9100]
    sample_limit: 5000
